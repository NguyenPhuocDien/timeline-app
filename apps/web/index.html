<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Timeline Focus — Quản Lý Thời Gian Cá Nhân</title>
  <meta name="description" content="Timeline Focus: lập kế hoạch ngày, theo dõi task, focus timer và quản lý thời gian offline-first trên mọi thiết bị.">
  <meta name="keywords" content="timeline, focus, planner, task, quản lý thời gian, productivity">
  <meta name="author" content="Timeline Focus">
  <link rel="canonical" href="https://timeline-app-one-beta.vercel.app/">
  <script>
    (function () {
      const host = window.location.hostname;
      if (!host.endsWith('.github.io')) return;
      const target = new URL('https://timeline-app-one-beta.vercel.app/');
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.toString());
    })();
  </script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TL Focus">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="img/icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Timeline Focus — Quản Lý Thời Gian Cá Nhân">
  <meta property="og:description" content="Lập kế hoạch ngày, timeline, focus timer và quản lý task offline-first.">
  <meta property="og:image" content="https://timeline-app-one-beta.vercel.app/img/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Timeline Focus">
  <meta name="twitter:description" content="Quản lý thời gian cá nhân offline-first.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <a href="#main-content" class="skip-link">Chuyển đến nội dung chính</a>
  <div class="app" id="app">
    <aside class="side" id="sidebar" aria-label="Thanh điều hướng">
      <div style="position:relative">
        <div class="sideBrand">
          <img src="img/campus-logo.png" alt="IUH Logo" width="32" height="32" onerror="this.style.display='none'">
          <div class="sideBrandText">
            <div class="logo">Timeline Focus</div>
            <div class="sub">Personal planner</div>
          </div>
        </div>
        <button class="sideCollapseBtn" id="sideCollapseBtn" aria-label="Thu gọn sidebar" title="Thu gọn sidebar">&#8249;</button>
      </div>
      <nav class="nav" id="nav" aria-label="Menu chính"></nav>
      <div class="sideActions">
        <button class="btn secondary" id="loginBtn">&#128273; Đăng nhập Đồng bộ</button>
        <button class="btn secondary" id="exportBtn">&#8593; Xuất dữ liệu</button>
        <button class="btn secondary" id="importBtn">&#8595; Nhập dữ liệu</button>
        <button class="btn secondary" id="themeBtn">&#9680; Giao diện</button>
        <button class="btn secondary" id="notifyBtn">&#128276; Thông báo</button>
      </div>
    
    <div class="legalLinks" style="padding:12px;font-size:11px;color:var(--muted, #999);text-align:center;border-top:1px solid var(--line, #e5e7eb);margin-top:auto">
      <a href="/privacy.html" target="_blank" rel="noopener" style="color:inherit">Quyền riêng tư</a>
      <span style="margin:0 4px">·</span>
      <a href="/terms.html" target="_blank" rel="noopener" style="color:inherit">Điều khoản</a>
      <span style="margin:0 4px">·</span>
      <a href="/contact.html" target="_blank" rel="noopener" style="color:inherit">Liên hệ</a>
    </div>
  </aside>
    <main class="main" id="main-content" tabindex="-1">
      <div class="top" role="banner">
        <div class="topInfo">
          <div class="h1" id="pageTitle">Dashboard</div>
          <div class="topMeta"><div class="clock" id="clock" aria-live="polite"></div><div class="clock" id="netStatus" aria-live="polite"></div></div>
        </div>
        <div class="topControls">
          <input class="input" type="date" id="selectedDate" style="width:170px" aria-label="Ngày đang xem">
          <button class="btn" id="openTaskBtn" title="Thêm task mới (N)">+ Task</button>
          <button class="btn secondary" onclick="window.print()" title="In trang" style="padding:7px 10px" aria-label="In">&#128438;</button>
        </div>
      </div>
      <section id="dashboard" class="section"></section>
      <section id="timeline" class="section"></section>
      <section id="tasks" class="section"></section>
      <section id="focus" class="section"></section>
      <section id="debt" class="section"></section>
      <section id="calendar" class="section"></section>
      <section id="analytics" class="section"></section>
      <section id="settings" class="section"></section>
    </main>
    <aside class="insight" id="insight"></aside>
  </div>
  <nav class="mobileTabs" id="mobileTabs" role="navigation" aria-label="Mobile tabs"></nav>
  <div class="modal" id="taskModal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
    <div class="dialog">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div class="h1" id="taskModalTitle">Thêm task</div><button class="btn secondary"
          onclick="closeModal('taskModal')" aria-label="Đóng modal">✕ Đóng</button>
      </div>
      <div class="form">
        <label>Tiêu đề<input class="input" id="fTitle"></label>
        <label>Ngày<input class="input" id="fDate" type="date"></label>
        <label>Duration phút<input class="input" id="fDuration" type="number" min="5" step="5"></label>
        <label>Priority<select id="fPriority">
            <option value="high">Cao</option>
            <option value="medium">Vừa</option>
            <option value="low">Thấp</option>
          </select></label>
        <label>Bắt đầu<input class="input" id="fStart" type="time"></label>
        <label>Kết thúc<input class="input" id="fEnd" type="time"></label>
        <label>Deadline<input class="input" id="fDeadline" type="time"></label>
        <label>Trạng thái<select id="fStatus">
            <option value="todo">todo</option>
            <option value="doing">doing</option>
            <option value="done">done</option>
            <option value="deferred">deferred</option>
            <option value="stack">stack</option>
          </select></label>
        <label>Tag<input class="input" id="fTags" placeholder="#study #work"></label>
        <label>Liên kết sự kiện<select id="fEvent"></select></label>
        <label class="full">Ghi chú<textarea id="fNotes"></textarea></label>
        <div class="checks full"><label><input type="checkbox" id="fMission"> Việc chính hôm nay</label><label><input
              type="checkbox" id="fDone"> Done</label></div>
        <div class="full row"><button class="btn" id="saveTaskBtn">Lưu</button><button class="btn secondary"
            id="deleteTaskBtn">Xoá</button><button class="btn ghost" type="button"
            onclick="quickDur(25)">25m</button><button class="btn ghost" type="button"
            onclick="quickDur(50)">50m</button><button class="btn ghost" type="button"
            onclick="quickDur(90)">90m</button><button class="btn ghost" type="button"
            onclick="quickDur(120)">2h</button></div>
      </div>
    </div>
  </div>
  <div class="modal" id="taskDetailModal" role="dialog" aria-modal="true" aria-label="Chi tiết task">
    <div class="dialog detail" id="taskDetailContent"></div>
  </div>
  <div class="modal" id="eventModal" role="dialog" aria-modal="true" aria-label="Thêm sự kiện">
    <div class="dialog">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div class="h1">Thêm sự kiện</div><button class="btn secondary" onclick="closeModal('eventModal')">Đóng</button>
      </div>
      <div class="form">
        <label>Tên sự kiện<input class="input" id="eTitle"></label>
        <label>Loại<select id="eType">
            <option value="solar">Dương lịch</option>
            <option value="lunar">Âm lịch tham khảo</option>
          </select></label>
        <label>Ngày<input class="input" id="eDate" type="date"></label>
        <label>Lặp lại<select id="eRecurring">
            <option value="yes">Hằng năm</option>
            <option value="no">Một lần</option>
          </select></label>
        <label class="full">Ghi chú<textarea id="eNotes"></textarea></label>
        <div class="full"><button class="btn" id="saveEventBtn">Lưu sự kiện</button></div>
      </div>
    </div>
  </div>
  <div class="modal" id="triageModal" role="dialog" aria-modal="true" aria-label="Xử lý việc tồn">
    <div class="dialog">
      <div id="triageContent"></div>
    </div>
  </div>
  <input type="file" id="importFile" accept="application/json" hidden>
  <div class="modal" id="scheduleModal" role="dialog" aria-modal="true" aria-label="Lên lịch ngày">
    <div class="dialog" style="max-width:400px">
      <div class="row" style="justify-content:space-between;margin-bottom:16px">
        <div class="h1" style="font-size:22px">Lên lịch ngày</div>
        <button class="btn secondary" id="scheduleCancelBtn">Đóng</button>
      </div>
      <p class="muted" style="margin:0 0 12px">Chọn ngày muốn xếp lại task nợ này:</p>
      <input class="input" type="date" id="scheduleDate" style="margin-bottom:14px">
      <button class="btn" id="scheduleConfirmBtn" style="width:100%">Xác nhận</button>
    </div>
  </div>
  <div class="modal" id="focusReviewModal" role="dialog" aria-modal="true" aria-label="Review phiên tập trung">
    <div class="dialog" style="max-width:620px">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div>
          <div class="h1">Review phiên tập trung</div>
          <div class="muted small" id="focusReviewMeta"></div>
        </div>
        <button class="btn secondary" onclick="closeFocusReview()">Đóng</button>
      </div>
      <label class="small muted" style="font-weight:700;text-transform:uppercase">Focus log</label>
      <textarea id="focusReviewLog" style="margin:6px 0 12px"></textarea>
      <label class="small muted" style="font-weight:700;text-transform:uppercase">Next action</label>
      <input class="input" id="focusReviewNext" placeholder="Bước tiếp theo nếu task chưa xong" style="margin:6px 0 14px">
      <div class="row">
        <button class="btn ok" onclick="focusReviewDone()">Đánh dấu Done</button>
        <button class="btn secondary" onclick="focusReviewSave()">Thêm log</button>
        <button class="btn secondary" onclick="focusReviewNextAction()">Tạo bước tiếp theo</button>
        <button class="btn warn" onclick="focusReviewStack()">Đưa vào việc tồn</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="app.js?v=14"></script>

  <!-- Local storage engine (IndexedDB/Dexie), Firebase Auth, Firestore sync, and sync status UI -->
  <script type="module" src="src/core/storage.js?v=14"></script>
  <script type="module" src="src/core/sync-engine.js?v=14"></script>
  <script type="module" src="src/ui/sync-indicator.js?v=14"></script>
</body>

</html>
