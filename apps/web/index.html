<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Timeline Focus — Quản Lý Thời Gian Cá Nhân</title>
  <meta name="description" content="Timeline Focus: lập kế hoạch ngày, theo dõi task, focus timer và quản lý thời gian offline-first trên mọi thiết bị.">
  <meta name="keywords" content="timeline, focus, planner, task, quản lý thời gian, productivity">
  <meta name="author" content="Timeline Focus">
  <link rel="canonical" href="https://timeline-app-one-beta.vercel.app/">
  <script>
    (function () {
      const host = window.location.hostname;
      if (!host.endsWith('.github.io')) return;
      const target = new URL('https://timeline-app-one-beta.vercel.app/');
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.toString());
    })();
  </script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TL Focus">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="img/icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Timeline Focus — Quản Lý Thời Gian Cá Nhân">
  <meta property="og:description" content="Lập kế hoạch ngày, timeline, focus timer và quản lý task offline-first.">
  <meta property="og:image" content="https://timeline-app-one-beta.vercel.app/img/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Timeline Focus">
  <meta name="twitter:description" content="Quản lý thời gian cá nhân offline-first.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <a href="#main-content" class="skip-link">Chuyển đến nội dung chính</a>
  <div class="app" id="app">
    <aside class="side" id="sidebar" aria-label="Thanh điều hướng">
      <div style="position:relative">
        <div class="sideBrand">
          <img src="img/campus-logo.png" alt="IUH Logo" width="32" height="32" onerror="this.style.display='none'">
          <div class="sideBrandText">
            <div class="logo">Timeline Focus</div>
            <div class="sub">Personal planner</div>
          </div>
        </div>
        <button class="sideCollapseBtn" id="sideCollapseBtn" aria-label="Thu gọn sidebar" title="Thu gọn sidebar">&#8249;</button>
      </div>
      <nav class="nav" id="nav" aria-label="Menu chính"></nav>
      <div class="sideActions">
        <button class="btn secondary" id="loginBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>Đăng nhập Đồng bộ</button>
        <button class="btn secondary" id="exportBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>Xuất dữ liệu</button>
        <button class="btn secondary" id="importBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>Nhập dữ liệu</button>
        <button class="btn secondary" id="themeBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 1 0-20 10 10 0 0 1 10 10c0 1.7-1.3 3-3 3h-2.5a2.5 2.5 0 0 0 0 5H12z"/><circle cx="6.5" cy="11.5" r=".5" fill="currentColor"/><circle cx="9.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="14.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="11.5" r=".5" fill="currentColor"/></svg>Giao diện</button>
        <button class="btn secondary" id="notifyBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 21a2 2 0 0 0 3.4 0"/><path d="M4 17h16"/><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/></svg>Thông báo</button>
      </div>
    
    <div class="legalLinks" style="padding:12px;font-size:11px;color:var(--muted, #999);text-align:center;border-top:1px solid var(--line, #e5e7eb);margin-top:auto">
      <a href="/privacy.html" target="_blank" rel="noopener" style="color:inherit">Quyền riêng tư</a>
      <span style="margin:0 4px">·</span>
      <a href="/terms.html" target="_blank" rel="noopener" style="color:inherit">Điều khoản</a>
      <span style="margin:0 4px">·</span>
      <a href="/contact.html" target="_blank" rel="noopener" style="color:inherit">Liên hệ</a>
    </div>
  </aside>
    <main class="main" id="main-content" tabindex="-1">
      <div class="top" role="banner">
        <div class="topInfo">
          <div class="h1" id="pageTitle">Dashboard</div>
          <div class="topMeta"><div class="clock" id="clock" aria-live="polite"></div><div class="clock" id="netStatus" aria-live="polite"></div></div>
        </div>
        <div class="topControls">
          <input class="input" type="date" id="selectedDate" style="width:170px" aria-label="Ngày đang xem">
          <button class="btn" id="openTaskBtn" title="Thêm task mới (N)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Công việc</button>
          <button class="btn secondary" onclick="window.print()" title="In trang" style="padding:7px 10px" aria-label="In"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg></button>
        </div>
      </div>
      <section id="dashboard" class="section"></section>
      <section id="timeline" class="section"></section>
      <section id="tasks" class="section"></section>
      <section id="focus" class="section"></section>
      <section id="debt" class="section"></section>
      <section id="calendar" class="section"></section>
      <section id="analytics" class="section"></section>
      <section id="settings" class="section"></section>
    </main>
    <aside class="insight" id="insight"></aside>
  </div>
  <nav class="mobileTabs" id="mobileTabs" role="navigation" aria-label="Mobile tabs"></nav>
  <div class="modal" id="taskModal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
    <div class="dialog taskDialog">
      <div class="taskModalHead">
        <div>
          <div class="eyebrow">Task editor</div>
          <div class="h1" id="taskModalTitle">Thêm task</div>
        </div>
        <button class="btn secondary iconBtnText" onclick="closeModal('taskModal')" aria-label="Đóng modal"><svg
            class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>Đóng</button>
      </div>
      <div class="form taskFormGrid">
        <section class="taskFormSection taskFormMain">
          <div class="formSectionTitle">Nội dung</div>
          <label class="field full">Tiêu đề<input class="input" id="fTitle" placeholder="Việc quan trọng cần hoàn thành"></label>
          <div class="fieldPair">
            <label class="field">Project<select id="fProject"></select></label>
            <label class="field">Goal<select id="fGoal"></select></label>
          </div>
          <label class="field full">Ghi chú<textarea id="fNotes" placeholder="Mục tiêu, phạm vi, kết quả mong muốn..."></textarea></label>
          <label class="field full">Tag<input class="input" id="fTags" placeholder="#study #work"></label>
        </section>
        <section class="taskFormSection">
          <div class="formSectionTitle">Lịch & nhịp làm</div>
          <div class="fieldPair">
            <label class="field">Ngày<input class="input" id="fDate" type="date"></label>
            <label class="field">Duration phút<input class="input" id="fDuration" type="number" min="5" step="5"></label>
          </div>
          <div class="fieldPair three">
            <label class="field">Bắt đầu<input class="input" id="fStart" type="time"></label>
            <label class="field">Kết thúc<input class="input" id="fEnd" type="time"></label>
            <label class="field">Deadline<input class="input" id="fDeadline" type="time"></label>
          </div>
          <div class="durationChips" aria-label="Chọn nhanh thời lượng">
            <button class="btn ghost" type="button" onclick="quickDur(25)">25m</button>
            <button class="btn ghost" type="button" onclick="quickDur(50)">50m</button>
            <button class="btn ghost" type="button" onclick="quickDur(90)">90m</button>
            <button class="btn ghost" type="button" onclick="quickDur(120)">2h</button>
          </div>
        </section>
        <section class="taskFormSection">
          <div class="formSectionTitle">Ưu tiên & trạng thái</div>
          <div class="fieldPair">
            <label class="field">Priority<select id="fPriority">
                <option value="high">Cao</option>
                <option value="medium">Vừa</option>
                <option value="low">Thấp</option>
              </select></label>
            <label class="field">Trạng thái<select id="fStatus">
                <option value="todo">todo</option>
                <option value="doing">doing</option>
                <option value="done">done</option>
                <option value="deferred">deferred</option>
                <option value="stack">stack</option>
              </select></label>
          </div>
          <div class="fieldPair">
            <label class="field">Impact<select id="fImpact">
                <option value="high">Tác động cao</option>
                <option value="medium">Tác động vừa</option>
                <option value="low">Tác động thấp</option>
              </select></label>
            <label class="field">Energy<select id="fEnergy">
                <option value="deep">Deep work</option>
                <option value="normal">Bình thường</option>
                <option value="light">Nhẹ</option>
              </select></label>
          </div>
          <label class="field full">Liên kết sự kiện<select id="fEvent"></select></label>
          <div class="checks formChecks">
            <label class="checkCard"><input type="checkbox" id="fMission"> <span>Việc chính hôm nay</span></label>
            <label class="checkCard"><input type="checkbox" id="fDone"> <span>Done</span></label>
          </div>
        </section>
        <div class="taskModalActions">
          <button class="btn" id="saveTaskBtn">Lưu task</button>
          <button class="btn secondary" id="deleteTaskBtn">Xoá</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal" id="taskDetailModal" role="dialog" aria-modal="true" aria-label="Chi tiết task">
    <div class="dialog detail" id="taskDetailContent"></div>
  </div>
  <div class="modal" id="eventModal" role="dialog" aria-modal="true" aria-label="Thêm sự kiện">
    <div class="dialog">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div class="h1">Thêm sự kiện</div><button class="btn secondary" onclick="closeModal('eventModal')">Đóng</button>
      </div>
      <div class="form">
        <label>Tên sự kiện<input class="input" id="eTitle"></label>
        <label>Loại<select id="eType">
            <option value="solar">Dương lịch</option>
            <option value="lunar">Âm lịch tham khảo</option>
          </select></label>
        <label>Ngày<input class="input" id="eDate" type="date"></label>
        <label>Lặp lại<select id="eRecurring">
            <option value="yes">Hằng năm</option>
            <option value="no">Một lần</option>
          </select></label>
        <label class="full">Ghi chú<textarea id="eNotes"></textarea></label>
        <div class="full"><button class="btn" id="saveEventBtn">Lưu sự kiện</button></div>
      </div>
    </div>
  </div>
  <div class="modal" id="triageModal" role="dialog" aria-modal="true" aria-label="Xử lý việc tồn">
    <div class="dialog">
      <div id="triageContent"></div>
    </div>
  </div>
  <input type="file" id="importFile" accept="application/json" hidden>
  <div class="modal" id="scheduleModal" role="dialog" aria-modal="true" aria-label="Lên lịch ngày">
    <div class="dialog" style="max-width:400px">
      <div class="row" style="justify-content:space-between;margin-bottom:16px">
        <div class="h1" style="font-size:22px">Lên lịch ngày</div>
        <button class="btn secondary" id="scheduleCancelBtn">Đóng</button>
      </div>
      <p class="muted" style="margin:0 0 12px">Chọn ngày muốn xếp lại task nợ này:</p>
      <input class="input" type="date" id="scheduleDate" style="margin-bottom:14px">
      <button class="btn" id="scheduleConfirmBtn" style="width:100%">Xác nhận</button>
    </div>
  </div>
  <div class="modal" id="focusReviewModal" role="dialog" aria-modal="true" aria-label="Review phiên tập trung">
    <div class="dialog" style="max-width:620px">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div>
          <div class="h1">Review phiên tập trung</div>
          <div class="muted small" id="focusReviewMeta"></div>
        </div>
        <button class="btn secondary" onclick="closeFocusReview()">Đóng</button>
      </div>
      <label class="small muted" style="font-weight:700;text-transform:uppercase">Focus log</label>
      <textarea id="focusReviewLog" style="margin:6px 0 12px"></textarea>
      <label class="small muted" style="font-weight:700;text-transform:uppercase">Next action</label>
      <input class="input" id="focusReviewNext" placeholder="Bước tiếp theo nếu task chưa xong" style="margin:6px 0 14px">
      <div class="row">
        <button class="btn ok" onclick="focusReviewDone()">Đánh dấu Done</button>
        <button class="btn secondary" onclick="focusReviewSave()">Thêm log</button>
        <button class="btn secondary" onclick="focusReviewNextAction()">Tạo bước tiếp theo</button>
        <button class="btn warn" onclick="focusReviewStack()">Đưa vào việc tồn</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="app.js?v=20"></script>

  <!-- Local storage engine (IndexedDB/Dexie), Firebase Auth, Firestore sync, and sync status UI -->
  <script type="module" src="src/core/storage.js?v=20"></script>
  <script type="module" src="src/core/sync-engine.js?v=20"></script>
  <script type="module" src="src/ui/sync-indicator.js?v=20"></script>
</body>

</html>
