<body>

  <div class="app" id="app">

      <div class="sideActions">

        <div class="topControls">

          <button class="btn" id="openTaskBtn" title="Thêm task mới (N)">+ Task</button>

      <section id="dashboard" class="section"></section>

  <nav class="mobileTabs" id="mobileTabs" role="navigation" aria-label="Mobile tabs"></nav>
  <div class="modal" id="taskModal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
    <div class="dialog">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div class="h1" id="taskModalTitle">Thêm task</div><button class="btn secondary"
          onclick="closeModal('taskModal')" aria-label="Đóng modal">✕ Đóng</button>
      </div>
      <div class="form">
        <label>Tiêu đề<input class="input" id="fTitle"></label>
        <label>Ngày<input class="input" id="fDate" type="date"></label>
        <label>Duration phút<input class="input" id="fDuration" type="number" min="5" step="5"></label>
        <label>Priority<select id="fPriority">
            <option value="high">Cao</option>
            <option value="medium">Vừa</option>
            <option value="low">Thấp</option>
          </select></label>
        <label>Bắt đầu<input class="input" id="fStart" type="time"></label>
        <label>Kết thúc<input class="input" id="fEnd" type="time"></label>
        <label>Deadline<input class="input" id="fDeadline" type="time"></label>
        <label>Trạng thái<select id="fStatus">
            <option value="todo">todo</option>
            <option value="doing">doing</option>
            <option value="done">done</option>
            <option value="deferred">deferred</option>
            <option value="stack">stack</option>
          </select></label>
        <label>Tag<input class="input" id="fTags" placeholder="#study #work"></label>
        <label>Liên kết sự kiện<select id="fEvent"></select></label>
        <label class="full">Ghi chú<textarea id="fNotes"></textarea></label>
        <div class="checks full"><label><input type="checkbox" id="fMission"> Việc chính hôm nay</label><label><input
              type="checkbox" id="fDone"> Done</label></div>
        <div class="full row"><button class="btn" id="saveTaskBtn">Lưu</button><button class="btn secondary"
            id="deleteTaskBtn">Xoá</button><button class="btn ghost" type="button"
            onclick="quickDur(25)">25m</button><button class="btn ghost" type="button"
            onclick="quickDur(50)">50m</button><button class="btn ghost" type="button"
            onclick="quickDur(90)">90m</button><button class="btn ghost" type="button"
            onclick="quickDur(120)">2h</button></div>
      </div>
    </div>
  </div>
  <div class="modal" id="taskDetailModal" role="dialog" aria-modal="true" aria-label="Chi tiết task">
    <div class="dialog detail" id="taskDetailContent"></div>
  </div>
  <div class="modal" id="eventModal" role="dialog" aria-modal="true" aria-label="Thêm sự kiện">
    <div class="dialog">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div class="h1">Thêm sự kiện</div><button class="btn secondary" onclick="closeModal('eventModal')">Đóng</button>
      </div>
      <div class="form">
        <label>Tên sự kiện<input class="input" id="eTitle"></label>
        <label>Loại<select id="eType">
            <option value="solar">Dương lịch</option>
            <option value="lunar">Âm lịch tham khảo</option>
          </select></label>
        <label>Ngày<input class="input" id="eDate" type="date"></label>
        <label>Lặp lại<select id="eRecurring">
            <option value="yes">Hằng năm</option>
            <option value="no">Một lần</option>

        <label class="full">Ghi chú<textarea id="eNotes"></textarea></label>
        <div class="full"><button class="btn" id="saveEventBtn">Lưu sự kiện</button></div>
      </div>
    </div>

  <div class="modal" id="triageModal" role="dialog" aria-modal="true" aria-label="Xử lý việc tồn">

      <div id="triageContent"></div>
    </div>

  <div class="modal" id="scheduleModal" role="dialog" aria-modal="true" aria-label="Lên lịch ngày">

        <button class="btn secondary" id="scheduleCancelBtn">Đóng</button>

      <input class="input" type="date" id="scheduleDate" style="margin-bottom:14px">
      <button class="btn" id="scheduleConfirmBtn" style="width:100%">Xác nhận</button>
    </div>
  </div>
  <div class="modal" id="focusReviewModal" role="dialog" aria-modal="true" aria-label="Review phiên tập trung">

      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div>
          <div class="h1">Review phiên tập trung</div>
          <div class="muted small" id="focusReviewMeta"></div>
        </div>
        <button class="btn secondary" onclick="closeFocusReview()">Đóng</button>
      </div>
      <label class="small muted" style="font-weight:700;text-transform:uppercase">Focus log</label>

      <label class="small muted" style="font-weight:700;text-transform:uppercase">Next action</label>
      <input class="input" id="focusReviewNext" placeholder="Bước tiếp theo nếu task chưa xong" style="margin:6px 0 14px">
      <div class="row">
        <button class="btn ok" onclick="focusReviewDone()">Đánh dấu Done</button>
        <button class="btn secondary" onclick="focusReviewSave()">Thêm log</button>
        <button class="btn secondary" onclick="focusReviewNextAction()">Tạo bước tiếp theo</button>
        <button class="btn warn" onclick="focusReviewStack()">Đưa vào việc tồn</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>

  <!-- FIREBASE INTEGRATION SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, signInWithRedirect, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const appHost = window.location.hostname;
    // Sử dụng domain mặc định của Firebase. Chiến lược popup-first ở dưới 
    // sẽ đảm bảo hoạt động cross-device (Safari/iOS) mà không bị lỗi Storage Partitioning
    const firebaseAuthDomain = "timeline-app-9a872.firebaseapp.com";

    // 🔴 BẠN CẦN THAY THẾ ĐOẠN NÀY BẰNG FIREBASE CONFIG CỦA BẠN 🔴
    const firebaseConfig = {
      apiKey: "AIzaSyBaSHqy3Vo7tYmsimmTMz7BJARPxtFmwdI",
      authDomain: firebaseAuthDomain,
      projectId: "timeline-app-9a872",
      storageBucket: "timeline-app-9a872.firebasestorage.app",
      messagingSenderId: "217681480315",
      appId: "1:217681480315:web:c3f39cb900bc0091c3f0de"
    };

    let app, auth, dbFire;
    try {
      if (firebaseConfig.apiKey.includes("THAY_BANG_KEY")) {
        console.warn("⚠️ Chưa cấu hình Firebase! Hãy dán config của bạn vào index.html để bật tính năng đồng bộ.");
      } else {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        dbFire = getFirestore(app);
      }
    } catch(e) {
      console.error("Firebase init error:", e);
    }

    let unsubscribeSnapshot = null;
    let isSyncing = false;
    let lastSyncDataStr = "";

    window.firebaseLogin = async () => {
      if (!auth) return toast("⚠️ Vui lòng cấu hình firebaseConfig trong file code trước khi dùng!");
      const provider = new GoogleAuthProvider();
      try {
        // FIX BUG-001: Luôn thử popup trước — hoạt động tốt nhất cross-device
        // vì tránh hoàn toàn vấn đề Storage Partitioning của redirect flow.
        const btn = document.getElementById('loginBtn');
        if (btn) btn.innerHTML = '⏳ Đang xử lý...';
        await signInWithPopup(auth, provider);
      } catch (err) {
        if (["auth/popup-blocked", "auth/cancelled-popup-request"].includes(err?.code)) {
          // Popup bị chặn → fallback sang redirect
          toast("Popup bị chặn, đang chuyển sang Google...");
          try {
            await signInWithRedirect(auth, provider);
          } catch (e2) {
            toast("❌ Đăng nhập thất bại: " + (e2?.message || e2));
          }
          return;
        }
        toast("❌ Đăng nhập thất bại: " + (err?.message || err));
      }
    };
    
    window.firebaseLogout = () => {
      if (!auth) return;
      signOut(auth).then(() => {
        toast("Đã đăng xuất");
      }).catch(err => toast("❌ Đăng xuất thất bại: " + err.message));
    };

    if (auth) {
      onAuthStateChanged(auth, user => {
        const btn = document.getElementById('loginBtn');
        if (user) {
          window.currentUserId = user.uid;
          const displayName = user.displayName?.split(' ')[0] || user.email?.split('@')[0] || 'User';
          if (btn) btn.innerHTML = `👤 ${displayName} (Đăng xuất)`;
          if (btn) btn.onclick = window.firebaseLogout;
          toast("✅ Đã kết nối Cloud: " + user.email);
          if (window.currentTab === 'settings') render();
          
          // Lắng nghe dữ liệu realtime từ Firestore
          const docRef = doc(dbFire, "users", window.currentUserId);
          unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
            if (isSyncing) return; // Đang đẩy data lên, bỏ qua pull
            if (!docSnap.exists() || !docSnap.data()?.db) {
              lastSyncDataStr = "";
              window.firebaseSync?.(db);
              return;
            }
            const data = docSnap.data();
            const newStr = JSON.stringify(data.db);
            if (newStr !== lastSyncDataStr) {
              lastSyncDataStr = newStr;
              if (window.updateDbFromFirebase) window.updateDbFromFirebase(data.db);
            }
          });
            
        } else {
          window.currentUserId = null;
          lastSyncDataStr = "";
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          if (btn) btn.innerHTML = `&#128273; Đăng nhập Đồng bộ`;
          if (btn) btn.onclick = window.firebaseLogin;
          if (window.currentTab === 'settings') render();
        }
      });
    } else {
      const btn = document.getElementById('loginBtn');
      if (btn) btn.onclick = () => toast("⚠️ Cần dán Firebase Config vào code để bật đồng bộ.");
    }

    window.firebaseSync = (localDb) => {
      if (!window.currentUserId || !dbFire) return;
      
      const dbCopy = JSON.parse(JSON.stringify(localDb));
      // 🔥 Rất quan trọng: Không lưu ảnh nền (base64) lên cloud để tránh lố giới hạn 1MB của Firestore
      dbCopy.settings.backgroundImage = ''; 
      dbCopy.settings.backgroundName = '';
      dbCopy.settings.backgroundPreset = 'none';

      const syncStr = JSON.stringify(dbCopy);
      if (syncStr === lastSyncDataStr) return; // Không có thay đổi
      
      isSyncing = true;
      lastSyncDataStr = syncStr;
      
      setDoc(doc(dbFire, "users", window.currentUserId), { db: dbCopy }).then(() => {
        isSyncing = false;
      }).catch(err => {
        console.error("Firebase Sync error:", err);
        isSyncing = false;
        toast("❌ Lỗi đồng bộ Cloud");
      });
    };
  </script>
</body>
