    /* ---- Reset & Base ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Skip link for keyboard accessibility */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 12px;
      z-index: 200;
      background: var(--brand);
      color: #fff;
      padding: 8px 16px;
      border-radius: var(--r-sm);
      font-weight: 600;
      font-size: 13px;
      transition: top var(--transition);
    }
    .skip-link:focus { top: 12px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      /* Safe area for iPhone X+ */
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, backdrop-filter 0.25s ease;
    }

    body::before {
      background-image: var(--wallpaper-image);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: var(--wallpaper-opacity);
      transform: scale(1.03);
      z-index: 0;
      filter: saturate(1.06) contrast(1.02);
    }

    body::after {
      background: var(--wallpaper-overlay);
      backdrop-filter: blur(var(--wallpaper-blur));
      z-index: 0;
      opacity: var(--wallpaper-opacity);
    }

    button, input, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; color: var(--text); background: transparent; }
    a { color: var(--brand); }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }

    /* ---- App Shell ---- */
    .app {
      display: grid;
      grid-template-columns: var(--side) minmax(0, 1fr);
      min-height: 100vh;
      transition: grid-template-columns var(--transition-slow);
      position: relative;
      z-index: 1;
    }

    .app.sidebar-collapsed {
      grid-template-columns: var(--side-collapsed) minmax(0, 1fr);
    }

    /* ---- Sidebar ---- */
    .side {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width var(--transition-slow);
      width: var(--side);
    }

    .app.sidebar-collapsed .side {
      width: var(--side-collapsed);
    }

    .sideBrand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 12px;
      border-bottom: 1px solid var(--line);
      min-width: 0;
    }

    .sideBrand img {
      width: 32px;
      height: 32px;
      min-width: 32px;
      object-fit: contain;
      border-radius: 8px;
    }

    .sideBrandText {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      transition: opacity var(--transition), width var(--transition);
    }

    .app.sidebar-collapsed .sideBrandText { opacity: 0; width: 0; pointer-events: none; }
    .app.sidebar-collapsed .nav button span.nav-label { display: none; }
    .app.sidebar-collapsed .nav button { justify-content: center; padding: 10px; }
    .app.sidebar-collapsed .sideActions { display: none; }

    .sideCollapseBtn {
      position: absolute;
      top: 12px;
      right: -12px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--panel);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      z-index: 20;
      box-shadow: var(--shadow);
      transition: background var(--transition);
      color: var(--muted);
    }
    .sideCollapseBtn:hover { background: var(--panel2); color: var(--text); }

    .logo {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .nav {
      flex: 1;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .nav button {
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border-radius: var(--r-sm);
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 500;
      transition: background var(--transition), color var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .nav button.active {
      background: var(--brand-light);
      color: var(--brand);
      font-weight: 600;
    }

    .nav button:hover:not(.active) {
      background: var(--panel2);
      color: var(--text);
    }

    .sideActions {
      padding: 10px 8px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sideActions .btn {
      font-size: 12px;
      padding: 7px 10px;
      justify-content: flex-start;
    }

    /* ---- Main ---- */
    .main {
      background: var(--bg);
      padding: 0;
      min-height: 100vh;
    }

    body.has-wallpaper,
    body.has-wallpaper .app,
    body.has-wallpaper .main,
    body.has-wallpaper .section {
      background: transparent !important;
    }

    body.has-wallpaper .side,
    body.has-wallpaper .top,
    body.has-wallpaper .card,
    body.has-wallpaper .task,
    body.has-wallpaper .quick,
    body.has-wallpaper .day,
    body.has-wallpaper .dialog,
    body.has-wallpaper .themeCard,
    body.has-wallpaper .bgCard,
    body.has-wallpaper .timelineWrap,
    body.has-wallpaper .hourLabel,
    body.has-wallpaper .calendar,
    body.has-wallpaper .mobileTabs,
    body.has-wallpaper .table th,
    body.has-wallpaper .table td {
      background: color-mix(in srgb, var(--panel) 82%, transparent);
      backdrop-filter: blur(16px);
    }

    body.has-wallpaper .side,
    body.has-wallpaper .top {
      background: color-mix(in srgb, var(--panel) 78%, transparent);
    }

    /* ---- Insight (hidden by default, shown as panel inside dashboard) ---- */
    .insight { display: none !important; }

    /* ---- Top bar ---- */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 24px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topInfo {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .topMeta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text);
    }

    .clock {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .topControls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
    }

    .statusPill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--panel2) 82%, transparent);
      border: 1px solid var(--line);
      color: var(--text2);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }

    .statusPill .statusDot {
      margin: 0;
    }

    /* ---- Section content padding ---- */
    .section { display: none; padding: 20px 24px; }
    .section.active { display: block; }

    /* ---- Buttons ---- */
    .btn {
      background: var(--brand);
      color: #fff;
      padding: 7px 12px;
      border-radius: var(--r-sm);
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }

    .btn:hover { background: var(--brand2); }

    .btn.secondary {
      background: var(--panel);
      color: var(--text2);
      border: 1px solid var(--line2);
    }

    .btn.secondary:hover { background: var(--panel2); }

    .btn.ghost {
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--line);
    }

    .btn.ghost:hover { background: var(--panel2); }

    .btn.ok { background: var(--ok); }
    .btn.ok:hover { background: #15803d; }

    .btn.warn { background: var(--warn); color: #fff; }
    .btn.warn:hover { background: #b45309; }

    .btn.bad { background: var(--bad); }
    .btn.bad:hover { background: #b91c1c; }

    .btn.sm {
      padding: 5px 9px;
      font-size: 12px;
      border-radius: 5px;
    }

    /* ---- Cards & Layout helpers ---- */
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .grid { display: grid; gap: 12px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }

    .card h3 {
      margin: 0 0 6px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .big {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .muted { color: var(--muted); }
    .small { font-size: 12px; }

    /* ---- Progress bar ---- */
    .bar {
      height: 5px;
      border-radius: 999px;
      background: var(--panel2);
      overflow: hidden;
      margin-top: 8px;
    }

    .bar > i {
      display: block;
      height: 100%;
      background: var(--brand);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* ---- Quick add bar ---- */
    .quick {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }

    /* ---- Inputs ---- */
    .input, select, textarea {
      width: 100%;
      border: 1px solid var(--line2);
      background: var(--panel);
      color: var(--text);
      padding: 7px 10px;
      border-radius: var(--r-sm);
      outline: none;
      font-size: 13.5px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .input:focus, select:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    textarea { min-height: 80px; resize: vertical; font-family: var(--font-mono); font-size: 13px; }

    /* ---- Pills & Badges ---- */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 4px 9px;
      border-radius: var(--r-sm);
      font-size: 12px;
      color: var(--muted);
    }

    .badge {
      font-size: 11px;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 7px;
      color: var(--muted);
      background: var(--panel2);
      font-weight: 500;
    }

    .badge.high { background: var(--bad-light); color: var(--bad); border-color: #fecaca; }
    .badge.medium { background: var(--brand-light); color: var(--brand); border-color: #bfdbfe; }
    .badge.low { background: var(--ok-light); color: var(--ok); border-color: #bbf7d0; }

    /* ---- Split layout ---- */
    .split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 16px;
    }

    /* ---- Timeline ---- */
    .timelineWrap {
      position: relative;
      border-top: 1px solid var(--line);
      height: calc(24 * var(--h));
      margin-top: 8px;
      background: var(--panel);
      border-radius: var(--r);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .hour {
      position: absolute;
      left: 0;
      right: 0;
      height: var(--h);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 56px 1fr;
    }

    .hourLabel {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      padding: 6px 8px;
      border-right: 1px solid var(--line);
      user-select: none;
    }

    .hourArea { position: relative; }
    .hourArea:hover { background: rgba(37,99,235,.03); }

    /* ---- NOW line ---- */
    .nowLine {
      position: absolute;
      left: 56px;
      right: 0;
      height: 2px;
      background: var(--bad);
      z-index: 8;
    }

    .nowLine::before {
      content: 'NOW';
      position: absolute;
      left: -46px;
      top: -9px;
      background: var(--bad);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 3px;
      padding: 2px 5px;
      letter-spacing: 0.5px;
    }

    /* ---- Task blocks (flat, left-border accent) ---- */
    .tblock {
      position: absolute;
      left: 64px;
      right: 10px;
      background: var(--brand-light);
      border: 1px solid #bfdbfe;
      border-left: 3px solid var(--brand);
      border-radius: var(--r-sm);
      padding: 5px 8px;
      overflow: hidden;
      z-index: 3;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }

    .tblock:hover { box-shadow: var(--shadow-md); }

    .tblock.high {
      background: var(--bad-light);
      border-color: #fecaca;
      border-left-color: var(--bad);
    }

    .tblock.medium {
      background: var(--brand-light);
      border-color: #bfdbfe;
      border-left-color: var(--brand);
    }

    .tblock.low {
      background: #f9fafb;
      border-color: var(--line);
      border-left-color: var(--muted);
    }

    .tblock.overlap { outline: 2px solid var(--warn); outline-offset: 1px; }

    .tblock.done {
      opacity: 0.5;
      text-decoration: line-through;
    }

    .tblock .name {
      font-weight: 600;
      font-size: 12.5px;
      color: var(--text);
      line-height: 1.3;
    }

    .tblock .meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ---- Task list ---- */
    .list { display: grid; gap: 8px; }

    .task {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 12px 14px;
      display: grid;
      gap: 6px;
      transition: box-shadow 0.15s;
    }

    .task:hover { box-shadow: var(--shadow-md); }

    .taskTop {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
    }

    .taskTitle { font-weight: 600; font-size: 13.5px; }

    /* ---- Calendar ---- */
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .dow {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 6px 6px;
    }

    .day {
      min-height: 90px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: border-color 0.15s;
    }

    .day:hover { border-color: var(--brand); }
    .day.sel { border-color: var(--brand); background: var(--brand-light); }
    .day.off { opacity: 0.35; }
    .day .num { font-weight: 700; font-size: 15px; }

    .dots { display: flex; gap: 3px; margin-top: auto; flex-wrap: wrap; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }

    /* ---- Modals ---- */
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: flex-start;
      justify-content: center;
      background: rgba(0,0,0,.35);
      z-index: 50;
      overflow: auto;
      padding: 40px 12px;
    }

    .modal.open { display: flex; }

    .dialog {
      width: min(820px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 20px;
      box-shadow: var(--shadow-md);
    }

    .dialog.detail {
      width: min(960px, 100%);
      padding: 0;
      overflow: hidden;
    }

    .detailHead {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .detailBody {
      padding: 18px 20px 20px;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr);
      gap: 16px;
    }

    .flowSection {
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: var(--panel);
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .flowSection h3 {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .flowItem {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: start;
      padding: 7px 0;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }

    .flowItem:first-of-type { border-top: 0; }
    .flowItem.done span { color: var(--muted); text-decoration: line-through; }

    .flowAdd {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    /* ---- Form ---- */
    .form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form .full { grid-column: 1 / -1; }

    .form label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .checks { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }

    /* ---- Tables ---- */
    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th, .table td { border-bottom: 1px solid var(--line); padding: 10px 12px; text-align: left; }
    .table th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; background: var(--panel2); }
    .table tr:hover td { background: var(--panel2); }

    /* ---- Triage ---- */
    .triageHero {
      background: var(--warn-light);
      border: 1px solid #fde68a;
      border-radius: var(--r);
      padding: 16px;
      margin: 12px 0;
    }

    /* ---- Analytics chart (enhanced) ---- */
    .chart {
      height: 120px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      border-bottom: 1px solid var(--line);
      padding: 8px 0;
    }

    .barv {
      flex: 1;
      background: var(--brand);
      opacity: 0.75;
      border-radius: 4px 4px 0 0;
      min-height: 4px;
      transition: height 0.4s cubic-bezier(.4,0,.2,1);
    }
    .barv:hover { opacity: 1; }

    /* Heatmap */
    .heatmap {
      display: grid;
      grid-template-columns: repeat(52, 1fr);
      gap: 2px;
      overflow-x: auto;
      padding: 4px 0 8px;
    }
    .heatmap-col { display: grid; gap: 2px; }
    .heatmap-cell {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 2px;
      background: var(--panel2);
      transition: opacity var(--transition), transform var(--transition), outline-color var(--transition);
      padding: 0;
      border: 0;
      display: block;
    }
    .heatmap-cell[data-level="1"] { background: color-mix(in srgb, var(--brand) 30%, var(--panel2)); }
    .heatmap-cell[data-level="2"] { background: color-mix(in srgb, var(--brand) 55%, var(--panel2)); }
    .heatmap-cell[data-level="3"] { background: color-mix(in srgb, var(--brand) 80%, var(--panel2)); }
    .heatmap-cell[data-level="4"] { background: var(--brand); }
    .heatmap-cell:hover { outline: 1px solid var(--brand); opacity: 0.92; transform: translateY(-1px); }

    /* SVG Line Chart */
    .lineChart { width: 100%; height: 164px; overflow: visible; }
    .lineChart .lc-grid { stroke: color-mix(in srgb, var(--line) 85%, transparent); stroke-width: 1; stroke-dasharray: 4 6; }
    .lineChart .lc-line { fill: none; stroke: var(--brand); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .lineChart .lc-area { fill: url(#lcGrad); opacity: 0.18; }
    .lineChart .lc-dot { fill: var(--brand); }
    .lineChart .lc-dot.active { r: 5; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--brand) 45%, transparent)); }
    .lineChart .lc-hit { cursor: pointer; }
    .lineChart .lc-hot { fill: transparent; }
    .lc-label { font: 10px var(--font); fill: var(--muted); }

    /* ---- Toast ---- */
    .toast {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: #fff;
      padding: 10px 18px;
      border-radius: var(--r-full);
      display: none;
      z-index: 60;
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      white-space: nowrap;
      max-width: calc(100vw - 32px);
    }

    .toast.show { display: block; animation: fadeUp 0.2s cubic-bezier(.4,0,.2,1); }

    .toast button {
      color: #fff;
      font-weight: 700;
      margin-left: 12px;
      text-decoration: underline;
      opacity: 0.9;
    }
    .toast button:hover { opacity: 1; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateX(-50%) translateY(8px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* Section fade transition */
    .section { display: none; padding: 20px 24px; animation: sectionIn 0.15s ease; }
    .section.active { display: block; }

    @keyframes sectionIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Focus Timer Ring */
    .focusRing {
      width: 180px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--brand) var(--focus-pct, 0%), var(--panel2) 0);
      position: relative;
      margin: 0 auto 12px;
      transition: background 0.5s ease;
    }
    .focusRing::before {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      background: var(--panel);
      border: 1px solid var(--line);
    }
    .focusRingCenter {
      position: relative;
      text-align: center;
      display: grid;
      gap: 2px;
    }
    .focusRingTime {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      font-family: var(--font-mono);
    }
    .focusRingLabel { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Empty state */
    .emptyState {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
      gap: 12px;
      color: var(--muted);
    }
    .emptyState svg { opacity: 0.4; }
    .emptyState h3 { font-size: 16px; font-weight: 600; color: var(--text2); }
    .emptyState p { font-size: 13px; max-width: 280px; line-height: 1.6; }

    /* Keyboard shortcut hints */
    .kbd {
      display: inline-block;
      padding: 1px 5px;
      border: 1px solid var(--line2);
      border-radius: 4px;
      font-size: 11px;
      font-family: var(--font-mono);
      background: var(--panel2);
      color: var(--muted);
      line-height: 1.5;
    }

    /* ---- Mobile tabs ---- */
    .mobileTabs { display: none; }

    /* ---- Text utilities ---- */
    .dangerText { color: var(--bad); }
    .okText { color: var(--ok); }
    .warnText { color: var(--warn); }

    .statusDot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      background: var(--ok);
      margin-right: 6px;
    }

    .statusDot.offline { background: var(--bad); }

    /* ---- Dashboard specific ---- */
    .cmd {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 14px;
      margin-bottom: 16px;
    }

    .recommend {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 14px 16px;
    }

    .recommend ol { margin: 8px 0 0; padding-left: 18px; }
    .recommend li { margin: 5px 0; color: var(--text2); font-size: 13px; }

    .eventPlan { border-left: 3px solid var(--brand); padding-left: 10px; margin-top: 6px; }

    .homeClock {
      display: grid;
      gap: 12px;
      justify-items: center;
      text-align: center;
    }

    .clockRing {
      width: 172px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--brand) var(--clock-pct, 0%), var(--panel2) 0);
      position: relative;
    }

    .clockRing::before {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .clockCenter {
      position: relative;
      display: grid;
      gap: 2px;
    }

    .clockTime {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1;
    }

    .clockDate {
      font-size: 12px;
      color: var(--muted);
      max-width: 132px;
    }

    .filterBar {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) 130px 130px 130px 130px;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .themeGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .themeCard {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--r);
      padding: 10px;
      text-align: left;
      display: grid;
      gap: 8px;
    }

    .themeCard.active {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent);
    }

    .themeCard small {
      color: var(--muted);
      line-height: 1.45;
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .swatches i {
      height: 18px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,.12);
    }

    .appearanceGrid {
      display: grid;
      gap: 16px;
    }

    .bgGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .bgCard {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--r);
      padding: 10px;
      display: grid;
      gap: 10px;
      text-align: left;
    }

    .bgCard.active {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent);
    }

    .bgPreview {
      height: 86px;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
      background: var(--bg-preview, linear-gradient(135deg, #1f2937, #111827));
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
    }

    .bgPreview::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 15%, rgba(0,0,0,.32) 100%);
    }

    .bgMeta {
      display: grid;
      gap: 3px;
    }

    .bgMeta small,
    .appearanceNote,
    .fileName {
      color: var(--muted);
      line-height: 1.5;
    }

    .appearanceNote,
    .fileName {
      font-size: 12px;
    }

    .uploadRow,
    .analyticsActions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .analyticsShell,
    .analyticsChartCard,
    .analyticsPreviewCard,
    .reasonList,
    .reasonRow {
      display: grid;
      gap: 16px;
    }

    .analyticsHero {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, .95fr);
      gap: 16px;
    }

    .analyticsPreviewHead {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .analyticsPreviewStats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .trendBoard {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .trendRow {
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel2) 68%, transparent);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 8px;
      text-align: left;
    }

    .trendRow.active {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent);
      background: color-mix(in srgb, var(--brand-light) 26%, var(--panel));
    }

    .trendHead {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
    }

    .trendDate {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .trendPct {
      font-size: 12px;
      font-weight: 700;
      color: var(--brand);
    }

    .trendMeta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .trendBar {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--panel2);
    }

    .trendBar i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--brand), var(--brand2));
    }

    .analyticsMiniStat {
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 10px;
      background: color-mix(in srgb, var(--panel2) 72%, transparent);
    }

    .analyticsMiniStat .small {
      display: block;
      margin-bottom: 6px;
    }

    .analyticsMiniStat strong {
      display: block;
      font-size: 19px;
      line-height: 1.1;
      letter-spacing: -0.4px;
    }

    .analyticsStrip {
      display: grid;
      grid-template-columns: repeat(14, minmax(0, 1fr));
      gap: 8px;
    }

    .dayChip {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: left;
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .dayChip.active {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent);
      transform: translateY(-1px);
    }

    .dayChipHead {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .dayChipValue {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.4px;
      line-height: 1;
    }

    .dayChipFocus {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    .dayChipBar {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: var(--panel2);
      overflow: hidden;
    }

    .dayChipBar i,
    .reasonBar i {
      display: block;
      height: 100%;
      border-radius: inherit;
    }

    .dayChipBar i {
      background: linear-gradient(90deg, var(--brand), var(--brand2));
    }

    .analyticsSubgrid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr);
      gap: 16px;
    }

    .reasonHead {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
    }

    .reasonBar {
      height: 8px;
      border-radius: 999px;
      background: var(--panel2);
      overflow: hidden;
    }

    .reasonBar i {
      background: linear-gradient(90deg, var(--warn), var(--brand));
    }

    .metricBadge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--brand-light) 75%, transparent);
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
    }

    .metricBadge.warn {
      background: color-mix(in srgb, var(--warn-light) 78%, transparent);
      color: var(--warn);
    }

    .metricBadge.ok {
      background: color-mix(in srgb, var(--ok-light) 78%, transparent);
      color: var(--ok);
    }

    /* ---- Responsive ---- */
    @media (max-width: 1180px) {
      .app { grid-template-columns: 200px minmax(0, 1fr); }
      .cards { grid-template-columns: repeat(2, 1fr); }
      .split, .cmd { grid-template-columns: 1fr; }
      .filterBar { grid-template-columns: 1fr 1fr 1fr; }
      .analyticsHero, .analyticsSubgrid { grid-template-columns: 1fr; }
      .analyticsStrip, .themeGrid, .bgGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (min-width: 768px) and (max-width: 900px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
      .split, .cmd { grid-template-columns: 1fr; }
      .filterBar { grid-template-columns: 1fr 1fr; }
    }

    /* Tablet: 781px-1180px — fix touch targets */
    @media (min-width: 781px) and (max-width: 1180px) {
      .btn { min-height: 40px; }
      .btn.sm { min-height: 40px; padding: 8px 12px; }
      .filterBar { grid-template-columns: 1fr 1fr; flex-wrap: wrap; }
      .nav button { padding: 10px 12px; }
    }

    @media (max-width: 780px) {
      :root { --h: 56px; }
      body { padding-bottom: calc(60px + env(safe-area-inset-bottom, 0)); }
      .app { display: block; }
      .side { display: none; }
      .main { min-height: auto; }
      .top { padding: 12px 16px; position: sticky; }
      .section { padding: 14px 16px; }

      .mobileTabs {
        display: grid;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--panel);
        border-top: 1px solid var(--line);
        grid-template-columns: repeat(5, 1fr);
        z-index: 40;
        padding-bottom: env(safe-area-inset-bottom, 0);
      }

      .mobileTabs button {
        background: transparent;
        color: var(--muted);
        padding: 10px 4px 8px;
        font-size: 11px;
        font-weight: 500;
        min-height: 52px;
      }

      .mobileTabs button.active {
        color: var(--brand);
        background: var(--brand-light);
      }

      /* Mobile touch targets — all buttons 38px min for compactness */
      .btn { min-height: 38px; }
      .btn.sm { min-height: 38px; min-width: 38px; padding: 8px 12px; }
      input, select, textarea { min-height: 38px; }

      .quick { grid-template-columns: 1fr; }
      .filterBar { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr 1fr; }
      .themeGrid, .bgGrid { grid-template-columns: 1fr 1fr; }
      .trendBoard { grid-template-columns: 1fr; }
      
      /* Form grid on mobile: 2 columns, but specific fields are full width */
      .form { grid-template-columns: 1fr 1fr; gap: 10px; }
      .form > label:nth-child(1),
      .form > label:nth-child(9),
      .form > label:nth-child(10) { grid-column: 1 / -1; }
      
      .form .checks { gap: 12px; justify-content: flex-start; }
      .form .checks label { flex-direction: row; align-items: center; letter-spacing: 0; text-transform: none; color: var(--text); font-size: 13px; }
      .form .checks input[type="checkbox"] { min-height: 20px; width: 20px; height: 20px; margin: 0; }

      .analyticsStrip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .analyticsPreviewStats { grid-template-columns: 1fr; }
      .timelineWrap { height: calc(24 * var(--h)); }
      .hour { height: 56px; grid-template-columns: 46px 1fr; }
      .tblock { left: 52px; }
      .nowLine { left: 46px; }
      .calendar { gap: 4px; }
      .day { min-height: 70px; padding: 6px; }
      .day .num { font-size: 14px; }
      .h1 { font-size: 18px; }
      .dialog { padding: 14px; }
      .table { font-size: 12px; }
      .top { flex-wrap: wrap; gap: 8px; }
      .topControls { width: 100%; justify-content: space-between; }
      .split { grid-template-columns: 1fr; }
      .detailBody { grid-template-columns: 1fr; padding: 14px; }
      .detailHead { padding: 14px; }
      .flowAdd { grid-template-columns: 1fr; }
      .task .row .btn { margin-bottom: 4px; }
    }

    /* ---- Print ---- */
    @media print {
      .side, .mobileTabs, .top, .btn, .sideCollapseBtn,
      .modal, .toast, .quick, .filterBar, .sideActions { display: none !important; }
      .app { display: block; }
      .main { padding: 0; }
      .section { display: block !important; padding: 0; }
      .section:not(.active) { display: none !important; }
      .card { break-inside: avoid; border: 1px solid #ccc; box-shadow: none; }
      body { background: #fff; color: #000; font-size: 12px; }
      .h1 { font-size: 18px; }
      .task { border: 1px solid #ccc; break-inside: avoid; }
      @page { margin: 1.5cm; }
    }
  </style>

</head>

    // Sweep-line O(n log n) để phát hiện overlap.
    function findOverlaps(tasks) {
      const set = new Set();
      if (tasks.length < 2) return set;
      // Event: [time, type (0=end, 1=start), taskId].
      const events = [];
      tasks.forEach(t => {
        const s = minOf(t.start), e = minOf(t.end);
        if (s === null || e === null) return;
        events.push([s, 1, t.id]); // start
        events.push([e, 0, t.id]);
      });
      events.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      const active = new Set();
      for (const [, type, id] of events) {
        if (type === 1) { // start
          if (active.size > 0) {
            set.add(id);
            active.forEach(aid => set.add(aid));
          }
          active.add(id);
        } else { // end
          active.delete(id);
        }
      }
      return set;
    }

    function openModal(id) {
      const modal = $('#' + id);
      if (!modal) return;
      modal.classList.add('open');
      // Focus trap: focus first focusable element inside
      const focusables = modal.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])');
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (first) first.focus();
      modal._trapHandler = (e) => {
        if (e.key !== 'Tab') return;
        if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last?.focus(); } }
        else { if (document.activeElement === last) { e.preventDefault(); first?.focus(); } }
      };
      modal.addEventListener('keydown', modal._trapHandler);
      // Close on backdrop click
      modal._backdropHandler = (e) => { if (e.target === modal) closeModal(id); };
      modal.addEventListener('click', modal._backdropHandler);
    }
    function closeModal(id) {
      const modal = $('#' + id);
      if (!modal) return;
      modal.classList.remove('open');

      if (modal._backdropHandler) modal.removeEventListener('click', modal._backdropHandler);
    }

    function importData(e) {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const raw = JSON.parse(r.result);
          // Schema validation: phải là object, có ít nhất tasks array
          if (!raw || typeof raw !== 'object') throw new Error('Not an object');
          if (!Array.isArray(raw.tasks)) throw new Error('Missing tasks array');
          // Sanitize: chỉ lấy các field đã biết, bỏ qua field lạ
          const safe = {
            tasks:    raw.tasks.filter(t => t && typeof t === 'object' && typeof t.title === 'string'),
            events:   Array.isArray(raw.events)   ? raw.events   : [],
            sessions: Array.isArray(raw.sessions) ? raw.sessions : [],
            settings: (raw.settings && typeof raw.settings === 'object') ? raw.settings : {},
            reviews:  (raw.reviews  && typeof raw.reviews  === 'object') ? raw.reviews  : {}
          };
          // Giới hạn kích thước để tránh DoS
          if (safe.tasks.length > 10000) throw new Error('Quá nhiều tasks (>10000)');
          db = Object.assign(defaultData(), safe);
          normalize(); save(); render();
          toast(`✅ Đã nhập ${safe.tasks.length} task, ${safe.events.length} sự kiện`);
        } catch (err) {
          console.error('[TL] Import failed:', err);
          toast('❌ File không hợp lệ: ' + err.message);
        }
      };
      r.readAsText(f);
    }
    function requestNotify() {
      if (!('Notification' in window)) { toast('Trình duyệt không hỗ trợ thông báo'); return; }
      if (Notification.permission === 'denied') {
        db.settings.notifications = false;
        save();
        toast('Bạn đã chặn thông báo. Hãy bật lại trong cài đặt trình duyệt nếu cần.');
        return;
      }
      if (Notification.permission === 'granted') {
        db.settings.notifications = true;
        save();
        toast('Thông báo đã được bật trước đó.');
        return;
      }
      Notification.requestPermission().then(p => {
        db.settings.notifications = p === 'granted';
        save();
        toast(p === 'granted' ? 'Đã bật thông báo' : 'Chưa cấp quyền');
      });
    }
    function notify(title, body) { if (db.settings.notifications && Notification.permission === 'granted') new Notification(title, { body }); else toast(title + ' - ' + body) }
    // SW registered once in init() — no duplicate here
    window.openTask = openTask; window.openTaskDetail = openTaskDetail; window.closeModal = closeModal; window.quickDur = quickDur; window.quickAdd = quickAdd; window.autoSchedule = autoSchedule; window.timelineClick = timelineClick; window.markDone = markDone; window.startFocus = startFocus; window.moveToStack = moveToStack; window.openTriage = openTriage; window.doToday = doToday; window.scheduleDebt = scheduleDebt; window.splitTask = splitTask; window.deleteById = deleteById; window.triageAction = triageAction; window.renderTriage = renderTriage; window.pauseFocus = pauseFocus; window.completeFocus = completeFocus; window.closeFocusReview = closeFocusReview; window.focusReviewDone = focusReviewDone; window.focusReviewSave = focusReviewSave; window.focusReviewNextAction = focusReviewNextAction; window.focusReviewStack = focusReviewStack; window.addFocus = addFocus; window.setFocusPreset = setFocusPreset; window.selectCalendarDay = selectCalendarDay; window.openEvent = openEvent; window.addPlanTask = addPlanTask; window.saveSettings = saveSettings; window.setTheme = setTheme; window.setBackgroundPreset = setBackgroundPreset; window.uploadBackgroundPrompt = uploadBackgroundPrompt; window.clearBackgroundImage = clearBackgroundImage; window.handleBackgroundUpload = handleBackgroundUpload; window.setAnalyticsPreview = setAnalyticsPreview; window.openAnalyticsDate = openAnalyticsDate; window.updateTaskFilter = updateTaskFilter; window.updateFlowSummary = updateFlowSummary; window.addFlowItem = addFlowItem; window.removeFlowItem = removeFlowItem; window.toggleFlowCheck = toggleFlowCheck; window.undoLast = undoLast;
    init();

  <!-- FIREBASE INTEGRATION SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, signInWithRedirect, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const appHost = window.location.hostname;
    const popupHosts = new Set(["localhost", "127.0.0.1"]);
    const usePopupAuth = popupHosts.has(appHost) || appHost.endsWith(".github.io");
    const liveAuthDomain = usePopupAuth ? "timeline-app-9a872.firebaseapp.com" : "timeline-app-one-beta.vercel.app";

    // 🔴 BẠN CẦN THAY THẾ ĐOẠN NÀY BẰNG FIREBASE CONFIG CỦA BẠN 🔴
    const firebaseConfig = {
      apiKey: "AIzaSyBaSHqy3Vo7tYmsimmTMz7BJARPxtFmwdI",
      authDomain: liveAuthDomain,
      projectId: "timeline-app-9a872",
      storageBucket: "timeline-app-9a872.firebasestorage.app",
      messagingSenderId: "217681480315",
      appId: "1:217681480315:web:c3f39cb900bc0091c3f0de"
    };

    let app, auth, dbFire;
    try {
      if (firebaseConfig.apiKey.includes("THAY_BANG_KEY")) {
        console.warn("⚠️ Chưa cấu hình Firebase! Hãy dán config của bạn vào index.html để bật tính năng đồng bộ.");
      } else {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        dbFire = getFirestore(app);
      }
    } catch(e) {
      console.error("Firebase init error:", e);
    }

    let unsubscribeSnapshot = null;
    let isSyncing = false;
    let lastSyncDataStr = "";

    window.firebaseLogin = async () => {
      if (!auth) return toast("⚠️ Vui lòng cấu hình firebaseConfig trong file code trước khi dùng!");
      const provider = new GoogleAuthProvider();
      try {
        if (usePopupAuth) {
          await signInWithPopup(auth, provider);
          return;
        }
        toast("Đang chuyển sang Google để đăng nhập...");
        await signInWithRedirect(auth, provider);
      } catch (err) {
        if (usePopupAuth && ["auth/popup-blocked", "auth/cancelled-popup-request"].includes(err?.code)) {
          toast("❌ Trình duyệt đã chặn popup đăng nhập. Hãy cho phép popup rồi thử lại.");
          return;
        }
        toast("❌ Đăng nhập thất bại: " + (err?.message || err));
      }
    };
    
    window.firebaseLogout = () => {
      if (!auth) return;
      signOut(auth).then(() => {
        toast("Đã đăng xuất");
      }).catch(err => toast("❌ Đăng xuất thất bại: " + err.message));
    };

    if (auth) {
      onAuthStateChanged(auth, user => {
        const btn = document.getElementById('loginBtn');
        if (user) {
          window.currentUserId = user.uid;
          if (btn) btn.innerHTML = `👤 ${user.displayName.split(' ')[0]} (Đăng xuất)`;
          if (btn) btn.onclick = window.firebaseLogout;
          toast("✅ Đã kết nối Cloud: " + user.email);
          if (window.currentTab === 'settings') render();
          
          // Lắng nghe dữ liệu realtime từ Firestore
          const docRef = doc(dbFire, "users", window.currentUserId);
          unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
            if (isSyncing) return; // Đang đẩy data lên, bỏ qua pull
            if (!docSnap.exists() || !docSnap.data()?.db) {
              lastSyncDataStr = "";
              window.firebaseSync?.(db);
              return;
            }
            const data = docSnap.data();
            const newStr = JSON.stringify(data.db);
            if (newStr !== lastSyncDataStr) {
              lastSyncDataStr = newStr;
              if (window.updateDbFromFirebase) window.updateDbFromFirebase(data.db);
            }
          });
            
        } else {
          window.currentUserId = null;
          lastSyncDataStr = "";
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          if (btn) btn.innerHTML = `&#128273; Đăng nhập Đồng bộ`;
          if (btn) btn.onclick = window.firebaseLogin;
          if (window.currentTab === 'settings') render();
        }
      });
    } else {
      const btn = document.getElementById('loginBtn');
      if (btn) btn.onclick = () => toast("⚠️ Cần dán Firebase Config vào code để bật đồng bộ.");
    }

    window.firebaseSync = (localDb) => {
      if (!window.currentUserId || !dbFire) return;
      
      const dbCopy = JSON.parse(JSON.stringify(localDb));
      // 🔥 Rất quan trọng: Không lưu ảnh nền (base64) lên cloud để tránh lố giới hạn 1MB của Firestore
      dbCopy.settings.backgroundImage = ''; 
      dbCopy.settings.backgroundName = '';
      dbCopy.settings.backgroundPreset = 'none';

      const syncStr = JSON.stringify(dbCopy);
      if (syncStr === lastSyncDataStr) return; // Không có thay đổi
      
      isSyncing = true;
      lastSyncDataStr = syncStr;
      
      setDoc(doc(dbFire, "users", window.currentUserId), { db: dbCopy }).then(() => {
        isSyncing = false;
      }).catch(err => {
        console.error("Firebase Sync error:", err);
        isSyncing = false;
        toast("❌ Lỗi đồng bộ Cloud");
      });
    };
  </script>
