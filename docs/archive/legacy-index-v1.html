<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timeline Focus - Personal Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <style>
    /* =============================================
       LEAN PRODUCTIVITY UI - flat, compact, clean
       Inspired by Todoist + Google Calendar + Notion
    ============================================= */
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --panel2: #f3f4f6;
      --muted: #6b7280;
      --text: #111827;
      --text2: #374151;
      --line: #e5e7eb;
      --line2: #d1d5db;
      --brand: #2563eb;
      --brand2: #1d4ed8;
      --brand-light: #eff6ff;
      --ok: #16a34a;
      --ok-light: #f0fdf4;
      --warn: #d97706;
      --warn-light: #fffbeb;
      --bad: #dc2626;
      --bad-light: #fef2f2;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 6px rgba(0,0,0,.05), 0 2px 4px rgba(0,0,0,.04);
      --r: 8px;
      --r-sm: 6px;
      --h: 64px;
      --side: 220px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    [data-theme="github-light"] {
      --bg: #f6f8fa;
      --panel: #ffffff;
      --panel2: #f0f3f6;
      --muted: #57606a;
      --text: #24292f;
      --text2: #3b434b;
      --line: #d8dee4;
      --line2: #afb8c1;
      --brand: #0969da;
      --brand2: #0550ae;
      --brand-light: #ddf4ff;
      --ok: #1a7f37;
      --ok-light: #dafbe1;
      --warn: #9a6700;
      --warn-light: #fff8c5;
      --bad: #cf222e;
      --bad-light: #ffebe9;
    }

    [data-theme="vscode-dark"] {
      --bg: #1e1e1e;
      --panel: #252526;
      --panel2: #2d2d30;
      --muted: #9da3ad;
      --text: #d4d4d4;
      --text2: #c7c7c7;
      --line: #3c3c3c;
      --line2: #555555;
      --brand: #3794ff;
      --brand2: #0078d4;
      --brand-light: #12395c;
      --ok: #6a9955;
      --ok-light: #193619;
      --warn: #d7ba7d;
      --warn-light: #3d321c;
      --bad: #f44747;
      --bad-light: #4a1f1f;
      --shadow: none;
      --shadow-md: 0 8px 18px rgba(0,0,0,.25);
    }

    [data-theme="vscode-dark-plus"] {
      --bg: #181818;
      --panel: #1f1f1f;
      --panel2: #2a2a2a;
      --muted: #a6a6a6;
      --text: #cccccc;
      --text2: #d7d7d7;
      --line: #333333;
      --line2: #4d4d4d;
      --brand: #4fc1ff;
      --brand2: #3794ff;
      --brand-light: #102f44;
      --ok: #89d185;
      --ok-light: #18371e;
      --warn: #cca700;
      --warn-light: #3a3110;
      --bad: #f14c4c;
      --bad-light: #4d1f24;
      --shadow: none;
      --shadow-md: 0 8px 18px rgba(0,0,0,.28);
    }

    [data-theme="one-dark-pro"] {
      --bg: #21252b;
      --panel: #282c34;
      --panel2: #2c313a;
      --muted: #abb2bf;
      --text: #d7dae0;
      --text2: #c8ccd4;
      --line: #3e4451;
      --line2: #4b5263;
      --brand: #61afef;
      --brand2: #528bff;
      --brand-light: #1e3a56;
      --ok: #98c379;
      --ok-light: #253b22;
      --warn: #e5c07b;
      --warn-light: #3d321f;
      --bad: #e06c75;
      --bad-light: #4a272b;
      --shadow: none;
      --shadow-md: 0 8px 20px rgba(0,0,0,.25);
    }

    [data-theme="dracula"] {
      --bg: #282a36;
      --panel: #2f3240;
      --panel2: #383a4a;
      --muted: #b6b6c9;
      --text: #f8f8f2;
      --text2: #e9e9f4;
      --line: #44475a;
      --line2: #6272a4;
      --brand: #8be9fd;
      --brand2: #50fa7b;
      --brand-light: #173b45;
      --ok: #50fa7b;
      --ok-light: #1e4429;
      --warn: #f1fa8c;
      --warn-light: #454620;
      --bad: #ff5555;
      --bad-light: #4a2328;
      --shadow: none;
      --shadow-md: 0 8px 20px rgba(0,0,0,.25);
    }

    [data-theme="monokai"] {
      --bg: #272822;
      --panel: #2f3129;
      --panel2: #383a31;
      --muted: #c2c2b0;
      --text: #f8f8f2;
      --text2: #e6e6dc;
      --line: #49483e;
      --line2: #676655;
      --brand: #66d9ef;
      --brand2: #a6e22e;
      --brand-light: #173c43;
      --ok: #a6e22e;
      --ok-light: #2e4219;
      --warn: #e6db74;
      --warn-light: #443f1e;
      --bad: #f92672;
      --bad-light: #4a1f2d;
      --shadow: none;
      --shadow-md: 0 8px 20px rgba(0,0,0,.25);
    }

    [data-theme="solarized-light"] {
      --bg: #fdf6e3;
      --panel: #fffaf0;
      --panel2: #eee8d5;
      --muted: #657b83;
      --text: #073642;
      --text2: #586e75;
      --line: #d7cfb7;
      --line2: #bdb59f;
      --brand: #268bd2;
      --brand2: #2aa198;
      --brand-light: #e1f2f4;
      --ok: #859900;
      --ok-light: #eef2cf;
      --warn: #b58900;
      --warn-light: #f5edcf;
      --bad: #dc322f;
      --bad-light: #f8ddda;
    }

    [data-theme="system"] {
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      [data-theme="system"] {
        --bg: #1e1e1e;
        --panel: #252526;
        --panel2: #2d2d30;
        --muted: #9da3ad;
        --text: #d4d4d4;
        --text2: #c7c7c7;
        --line: #3c3c3c;
        --line2: #555555;
        --brand: #3794ff;
        --brand2: #0078d4;
        --brand-light: #12395c;
        --ok: #6a9955;
        --ok-light: #193619;
        --warn: #d7ba7d;
        --warn-light: #3d321c;
        --bad: #f44747;
        --bad-light: #4a1f1f;
        --shadow: none;
        --shadow-md: 0 8px 18px rgba(0,0,0,.25);
      }
    }

    /* ---- Reset & Base ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; color: var(--text); background: transparent; }

    /* ---- App Shell - 2 columns, no gap ---- */
    .app {
      display: grid;
      grid-template-columns: var(--side) minmax(0, 1fr);
      min-height: 100vh;
    }

    /* ---- Sidebar ---- */
    .side {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sideBrand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 14px 14px;
      border-bottom: 1px solid var(--line);
    }

    .sideBrand img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      border-radius: 6px;
    }

    .sideBrandText { flex: 1; min-width: 0; }

    .logo {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .nav {
      flex: 1;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
    }

    .nav button {
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border-radius: var(--r-sm);
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 500;
      transition: background 0.1s, color 0.1s;
    }

    .nav button.active {
      background: var(--brand-light);
      color: var(--brand);
      font-weight: 600;
    }

    .nav button:hover:not(.active) {
      background: var(--panel2);
      color: var(--text);
    }

    .sideActions {
      padding: 10px 8px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sideActions .btn {
      font-size: 12px;
      padding: 7px 10px;
      justify-content: flex-start;
    }

    /* ---- Main ---- */
    .main {
      background: var(--bg);
      padding: 0;
      min-height: 100vh;
    }

    /* ---- Insight (hidden by default, shown as panel inside dashboard) ---- */
    .insight { display: none !important; }

    /* ---- Top bar ---- */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 24px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text);
    }

    .clock {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    /* ---- Section content padding ---- */
    .section { display: none; padding: 20px 24px; }
    .section.active { display: block; }

    /* ---- Buttons ---- */
    .btn {
      background: var(--brand);
      color: #fff;
      padding: 7px 12px;
      border-radius: var(--r-sm);
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }

    .btn:hover { background: var(--brand2); }

    .btn.secondary {
      background: var(--panel);
      color: var(--text2);
      border: 1px solid var(--line2);
    }

    .btn.secondary:hover { background: var(--panel2); }

    .btn.ghost {
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--line);
    }

    .btn.ghost:hover { background: var(--panel2); }

    .btn.ok { background: var(--ok); }
    .btn.ok:hover { background: #15803d; }

    .btn.warn { background: var(--warn); color: #fff; }
    .btn.warn:hover { background: #b45309; }

    .btn.bad { background: var(--bad); }
    .btn.bad:hover { background: #b91c1c; }

    .btn.sm {
      padding: 5px 9px;
      font-size: 12px;
      border-radius: 5px;
    }

    /* ---- Cards & Layout helpers ---- */
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .grid { display: grid; gap: 12px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }

    .card h3 {
      margin: 0 0 6px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .big {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .muted { color: var(--muted); }
    .small { font-size: 12px; }

    /* ---- Progress bar ---- */
    .bar {
      height: 5px;
      border-radius: 999px;
      background: var(--panel2);
      overflow: hidden;
      margin-top: 8px;
    }

    .bar > i {
      display: block;
      height: 100%;
      background: var(--brand);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* ---- Quick add bar ---- */
    .quick {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }

    /* ---- Inputs ---- */
    .input, select, textarea {
      width: 100%;
      border: 1px solid var(--line2);
      background: var(--panel);
      color: var(--text);
      padding: 7px 10px;
      border-radius: var(--r-sm);
      outline: none;
      font-size: 13.5px;
      transition: border-color 0.15s;
    }

    .input:focus, select:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }

    textarea { min-height: 80px; resize: vertical; }

    /* ---- Pills & Badges ---- */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 4px 9px;
      border-radius: var(--r-sm);
      font-size: 12px;
      color: var(--muted);
    }

    .badge {
      font-size: 11px;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 7px;
      color: var(--muted);
      background: var(--panel2);
      font-weight: 500;
    }

    .badge.high { background: var(--bad-light); color: var(--bad); border-color: #fecaca; }
    .badge.medium { background: var(--brand-light); color: var(--brand); border-color: #bfdbfe; }
    .badge.low { background: var(--ok-light); color: var(--ok); border-color: #bbf7d0; }

    /* ---- Split layout ---- */
    .split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 16px;
    }

    /* ---- Timeline ---- */
    .timelineWrap {
      position: relative;
      border-top: 1px solid var(--line);
      height: calc(24 * var(--h));
      margin-top: 8px;
      background: var(--panel);
      border-radius: var(--r);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .hour {
      position: absolute;
      left: 0;
      right: 0;
      height: var(--h);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 56px 1fr;
    }

    .hourLabel {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      padding: 6px 8px;
      border-right: 1px solid var(--line);
      user-select: none;
    }

    .hourArea { position: relative; }
    .hourArea:hover { background: rgba(37,99,235,.03); }

    /* ---- NOW line ---- */
    .nowLine {
      position: absolute;
      left: 56px;
      right: 0;
      height: 2px;
      background: var(--bad);
      z-index: 8;
    }

    .nowLine::before {
      content: 'NOW';
      position: absolute;
      left: -46px;
      top: -9px;
      background: var(--bad);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 3px;
      padding: 2px 5px;
      letter-spacing: 0.5px;
    }

    /* ---- Task blocks (flat, left-border accent) ---- */
    .tblock {
      position: absolute;
      left: 64px;
      right: 10px;
      background: var(--brand-light);
      border: 1px solid #bfdbfe;
      border-left: 3px solid var(--brand);
      border-radius: var(--r-sm);
      padding: 5px 8px;
      overflow: hidden;
      z-index: 3;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }

    .tblock:hover { box-shadow: var(--shadow-md); }

    .tblock.high {
      background: var(--bad-light);
      border-color: #fecaca;
      border-left-color: var(--bad);
    }

    .tblock.medium {
      background: var(--brand-light);
      border-color: #bfdbfe;
      border-left-color: var(--brand);
    }

    .tblock.low {
      background: #f9fafb;
      border-color: var(--line);
      border-left-color: var(--muted);
    }

    .tblock.overlap { outline: 2px solid var(--warn); outline-offset: 1px; }

    .tblock.done {
      opacity: 0.5;
      text-decoration: line-through;
    }

    .tblock .name {
      font-weight: 600;
      font-size: 12.5px;
      color: var(--text);
      line-height: 1.3;
    }

    .tblock .meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ---- Task list ---- */
    .list { display: grid; gap: 8px; }

    .task {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 12px 14px;
      display: grid;
      gap: 6px;
      transition: box-shadow 0.15s;
    }

    .task:hover { box-shadow: var(--shadow-md); }

    .taskTop {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
    }

    .taskTitle { font-weight: 600; font-size: 13.5px; }

    /* ---- Calendar ---- */
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .dow {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 6px 6px;
    }

    .day {
      min-height: 90px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: border-color 0.15s;
    }

    .day:hover { border-color: var(--brand); }
    .day.sel { border-color: var(--brand); background: var(--brand-light); }
    .day.off { opacity: 0.35; }
    .day .num { font-weight: 700; font-size: 15px; }

    .dots { display: flex; gap: 3px; margin-top: auto; flex-wrap: wrap; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }

    /* ---- Modals ---- */
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: flex-start;
      justify-content: center;
      background: rgba(0,0,0,.35);
      z-index: 50;
      overflow: auto;
      padding: 40px 12px;
    }

    .modal.open { display: flex; }

    .dialog {
      width: min(820px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 20px;
      box-shadow: var(--shadow-md);
    }

    .dialog.detail {
      width: min(960px, 100%);
      padding: 0;
      overflow: hidden;
    }

    .detailHead {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .detailBody {
      padding: 18px 20px 20px;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr);
      gap: 16px;
    }

    .flowSection {
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: var(--panel);
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .flowSection h3 {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .flowItem {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: start;
      padding: 7px 0;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }

    .flowItem:first-of-type { border-top: 0; }
    .flowItem.done span { color: var(--muted); text-decoration: line-through; }

    .flowAdd {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    /* ---- Form ---- */
    .form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form .full { grid-column: 1 / -1; }

    .form label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .checks { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }

    /* ---- Tables ---- */
    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th, .table td { border-bottom: 1px solid var(--line); padding: 10px 12px; text-align: left; }
    .table th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; background: var(--panel2); }
    .table tr:hover td { background: var(--panel2); }

    /* ---- Triage ---- */
    .triageHero {
      background: var(--warn-light);
      border: 1px solid #fde68a;
      border-radius: var(--r);
      padding: 16px;
      margin: 12px 0;
    }

    /* ---- Analytics chart ---- */
    .chart {
      height: 120px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      border-bottom: 1px solid var(--line);
      padding: 8px 0;
    }

    .barv {
      flex: 1;
      background: var(--brand);
      opacity: 0.75;
      border-radius: 4px 4px 0 0;
      min-height: 4px;
      transition: height 0.3s;
    }

    /* ---- Toast ---- */
    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: #fff;
      padding: 9px 16px;
      border-radius: var(--r-sm);
      display: none;
      z-index: 60;
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-md);
    }

    .toast.show { display: block; animation: fadeUp 0.2s ease; }

    .toast button {
      color: #fff;
      font-weight: 700;
      margin-left: 12px;
      text-decoration: underline;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateX(-50%) translateY(6px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ---- Mobile tabs ---- */
    .mobileTabs { display: none; }

    /* ---- Text utilities ---- */
    .dangerText { color: var(--bad); }
    .okText { color: var(--ok); }
    .warnText { color: var(--warn); }

    .statusDot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      background: var(--ok);
      margin-right: 6px;
    }

    .statusDot.offline { background: var(--bad); }

    /* ---- Dashboard specific ---- */
    .cmd {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 14px;
      margin-bottom: 16px;
    }

    .recommend {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 14px 16px;
    }

    .recommend ol { margin: 8px 0 0; padding-left: 18px; }
    .recommend li { margin: 5px 0; color: var(--text2); font-size: 13px; }

    .eventPlan { border-left: 3px solid var(--brand); padding-left: 10px; margin-top: 6px; }

    .homeClock {
      display: grid;
      gap: 12px;
      justify-items: center;
      text-align: center;
    }

    .clockRing {
      width: 172px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--brand) var(--clock-pct, 0%), var(--panel2) 0);
      position: relative;
    }

    .clockRing::before {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .clockCenter {
      position: relative;
      display: grid;
      gap: 2px;
    }

    .clockTime {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1;
    }

    .clockDate {
      font-size: 12px;
      color: var(--muted);
      max-width: 132px;
    }

    .filterBar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 140px 140px 140px 140px;
      gap: 8px;
      margin-bottom: 14px;
    }

    .themeGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .themeCard {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--r);
      padding: 10px;
      text-align: left;
      display: grid;
      gap: 8px;
    }

    .themeCard.active {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent);
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .swatches i {
      height: 18px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,.12);
    }

    /* ---- Responsive ---- */
    @media (max-width: 1180px) {
      .app { grid-template-columns: 200px minmax(0, 1fr); }
      .cards { grid-template-columns: repeat(2, 1fr); }
      .split, .cmd { grid-template-columns: 1fr; }
    }

    @media (max-width: 780px) {
      :root { --h: 56px; }
      body { padding-bottom: 60px; }
      .app { display: block; }
      .side { display: none; }
      .main { min-height: auto; }
      .top { padding: 12px 16px; position: sticky; }
      .section { padding: 14px 16px; }

      .mobileTabs {
        display: grid;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--panel);
        border-top: 1px solid var(--line);
        grid-template-columns: repeat(5, 1fr);
        z-index: 40;
      }

      .mobileTabs button {
        background: transparent;
        color: var(--muted);
        padding: 10px 4px 8px;
        font-size: 11px;
        font-weight: 500;
        min-height: 52px;
      }

      .mobileTabs button.active {
        color: var(--brand);
        background: var(--brand-light);
      }

      /* Mobile touch targets */
      .btn.sm { min-height: 44px; min-width: 44px; padding: 10px 12px; }

      .quick { grid-template-columns: 1fr; }
      .filterBar { grid-template-columns: 1fr 1fr; }
      .cards { grid-template-columns: 1fr; }
      .themeGrid { grid-template-columns: 1fr 1fr; }
      .form { grid-template-columns: 1fr; }
      .timelineWrap { height: calc(24 * var(--h)); }
      .hour { height: 56px; grid-template-columns: 46px 1fr; }
      .tblock { left: 52px; }
      .nowLine { left: 46px; }
      .calendar { gap: 4px; }
      .day { min-height: 70px; padding: 6px; }
      .day .num { font-size: 14px; }
      .h1 { font-size: 18px; }
      .dialog { padding: 14px; }
      .table { font-size: 12px; }
      .top { flex-wrap: wrap; gap: 8px; }
      .split { grid-template-columns: 1fr; }
      .detailBody { grid-template-columns: 1fr; padding: 14px; }
      .detailHead { padding: 14px; }
      .flowAdd { grid-template-columns: 1fr; }
    }
  </style>

</head>

  <script>

    let currentTab = 'dashboard', selectedDate = fmtDate(new Date()), editingTaskId = null, detailTaskId = null, focusTimer = null, focusRemain = 0, focusTaskId = null, focusStartedAt = null, focusInitialSeconds = 0;
    let undoStack = [], pendingFocusReview = null;
    let taskFilters = { q: '', status: 'all', priority: 'all', tag: 'all', special: 'all' };
    let db = load();
    function uid() { return crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()) }

    function endOfDay(d) { const x = startOfDay(d); x.setDate(x.getDate() + 1); return x }

    function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d) }
    function minOf(t) { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m }
    function timeOfMin(n) { n = ((n % 1440) + 1440) % 1440; return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0') }
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)) }
    function pct(n) { return clamp(Math.round(n), 0, 100) }
    function esc(s) { return String(s ?? '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])) }
    function toast(msg, action = null) { const t = $('#toast'); t.innerHTML = `${esc(msg)}${action ? ` <button onclick="${action.fn}">${esc(action.label)}</button>` : ''}`; t.classList.add('show'); clearTimeout(toast._timer); toast._timer = setTimeout(() => t.classList.remove('show'), action ? 5200 : 2200) }
    function cloneDb() { return JSON.parse(JSON.stringify(db)) }

    function undoLast() { const item = undoStack.pop(); if (!item) return; db = item.db; selectedDate = item.selectedDate || selectedDate; normalize(); render(); toast(`Đã hoàn tác: ${item.label}`) }
    function toastUndo(msg) { toast(msg, { label: 'Hoàn tác', fn: 'undoLast()' }) }
    function getHourHeight() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--h')) || 64 }

    function ensureFlow(t) {

      ['notes', 'blockers', 'nextActions', 'logs'].forEach(k => t.flow[k] = (t.flow[k] || []).map(x => typeof x === 'string' ? { id: uid(), text: x, createdAt: new Date().toISOString() } : Object.assign({ id: uid(), text: '', createdAt: new Date().toISOString() }, x)));
      return t.flow;
    }
    function normalizeThemeId(id) { if (id === 'light') return 'github-light'; if (id === 'dark') return 'vscode-dark'; return THEMES.some(t => t.id === id) ? id : 'github-light' }
    function activeTheme() { return THEMES.find(t => t.id === normalizeThemeId(db.settings.theme)) || THEMES[0] }
    function applyTheme(id = db.settings.theme) {
      const themeId = normalizeThemeId(id);

    function setTheme(id) { applyTheme(id); save(); render(); toast(`Đã đổi sang ${activeTheme().name}`) }
    function cycleTheme() {

      const i = THEMES.findIndex(t => t.id === current);

    }
    function themePickerHTML() {

    }
    function defaultData() { return { tasks: [], events: seedEvents(), sessions: [], settings: { theme: 'github-light', accent: 'blue', availableStart: '07:00', availableEnd: '22:00', dailyMissionLimit: 3, notifications: false }, reviews: {} } }
    function load() { try { return Object.assign(defaultData(), JSON.parse(localStorage.getItem(KEY) || '{}')) } catch (e) { return defaultData() } }
    function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
    function seedEvents() {

        { id: uid(), title: 'Giải phóng miền Nam', type: 'solar', date: '2026-04-30', recurring: true, notes: '' }, { id: uid(), title: 'Quốc tế Lao động', type: 'solar', date: '2026-05-01', recurring: true, notes: '' }, { id: uid(), title: 'Quốc khánh Việt Nam', type: 'solar', date: '2026-09-02', recurring: true, notes: '' }, { id: uid(), title: 'Tết Trung Thu', type: 'lunar', date: '2026-09-25', recurring: true, notes: '15/8 âm lịch, tham khảo' },
        { id: uid(), title: 'Ngày Phụ nữ Việt Nam', type: 'solar', date: '2026-10-20', recurring: true, notes: '' }, { id: uid(), title: 'Ngày Nhà giáo Việt Nam', type: 'solar', date: '2026-11-20', recurring: true, notes: '' }, { id: uid(), title: 'Giáng sinh', type: 'solar', date: '2026-12-25', recurring: true, notes: '' }, { id: uid(), title: 'Ông Công Ông Táo', type: 'lunar', date: '2027-02-01', recurring: true, notes: '23 tháng Chạp âm lịch, tham khảo' },
        { id: uid(), title: 'Tết Nguyên Đán', type: 'lunar', date: '2027-02-06', recurring: true, notes: 'Mùng 1 Tết âm lịch, tham khảo' }]
    }
    function normalize() { db.settings = Object.assign({ theme: 'github-light', accent: 'blue', availableStart: '07:00', availableEnd: '22:00', dailyMissionLimit: 3, notifications: false }, db.settings || {}); db.settings.theme = normalizeThemeId(db.settings.theme); db.tasks.forEach(t => { if (!t.id) t.id = uid(); if (t.done && t.status !== 'done') t.status = 'done'; if (!t.status) t.status = t.done ? 'done' : 'todo'; if (!t.createdAt) t.createdAt = new Date().toISOString(); if (!t.duration) t.duration = 60; ensureFlow(t); }); autoStackOld(); save(); }
    function autoStackOld() {
      const today = fmtDate(new Date());
      db.tasks.forEach(t => {
        if (t.date < today && !['done', 'stack', 'deleted'].includes(t.status)) {
          t.status = 'stack';
          t.stackType = t.deadline ? 'overdue' : 'unfinished';

    }
    function dayTasks(date = selectedDate) { return db.tasks.filter(t => t.date === date && t.status !== 'deleted') }
    function activeDayTasks(date = selectedDate) { return dayTasks(date).filter(t => t.status !== 'stack') }
    function stackTasks() { return db.tasks.filter(t => t.status === 'stack') }

    function eventsUpcoming() { const now = startOfDay(new Date()); return db.events.map(e => { let d = parseDate(e.date); if (e.recurring) { d = new Date(now.getFullYear(), d.getMonth(), d.getDate()); if (d < now) d = new Date(now.getFullYear() + 1, d.getMonth(), d.getDate()) } return { ...e, date: fmtDate(d), days: Math.ceil((d - now) / 86400000) } }).filter(e => e.days >= 0).sort((a, b) => a.days - b.days).slice(0, 12) }
    function addPlanTask(eventId) { const e = db.events.find(x => x.id === eventId); openTask(null, { date: selectedDate, title: 'Chuẩn bị: ' + (e?.title || ''), duration: 60, priority: 'high', eventId }) }
    function renderAnalytics() { const days = []; for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const fd = fmtDate(d), s = stats(fd); days.push({ date: fd, done: s.donePct, focus: db.sessions.filter(x => x.date === fd).reduce((a, x) => a + Number(x.minutes || 0), 0) }) } const reasons = {}; stackTasks().forEach(t => { reasons[t.reason || 'Không rõ'] = (reasons[t.reason || 'Không rõ'] || 0) + 1 }); $('#analytics').innerHTML = `<div class="cards"><div class="card"><h3>Hoàn thành 7 ngày</h3><div class="chart">${days.map(d => `<div class="barv" style="height:${Math.max(4, d.done)}%" title="${d.date}: ${Math.round(d.done)}%"></div>`).join('')}</div></div><div class="card"><h3>Phút tập trung</h3><div class="chart">${days.map(d => `<div class="barv" style="height:${Math.min(100, d.focus)}%" title="${d.date}: ${d.focus}m"></div>`).join('')}</div></div><div class="card"><h3>Lý do tồn nhiều nhất</h3>${Object.entries(reasons).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([k, v]) => `<p>${esc(k)}: <b>${v}</b></p>`).join('') || '<div class="muted">Chưa có việc tồn.</div>'}</div><div class="card"><h3>Gợi ý</h3>${analyticsInsight(days)}</div></div>` }
    function analyticsInsight(days) { const avg = days.reduce((a, d) => a + d.done, 0) / days.length; const debt = stackTasks().length; let html = `<p>Hoàn thành trung bình: <b>${Math.round(avg)}%</b></p>`; if (avg < 50) html += '<p class="warnText">Nên giảm số task/ngày hoặc chia nhỏ task >90 phút.</p>'; if (debt > 3) html += '<p class="dangerText">Việc tồn đang cao. Hãy dùng Xử lý việc tồn.</p>'; return html }
    function renderSettings() { $('#settings').innerHTML = `<div class="card" style="margin-bottom:16px"><h3>Giao diện</h3>${themePickerHTML()}</div><div class="form"><label>Giờ bắt đầu khả dụng<input class="input" type="time" id="setStart" value="${db.settings.availableStart}"></label><label>Giờ kết thúc khả dụng<input class="input" type="time" id="setEnd" value="${db.settings.availableEnd}"></label><label>Giới hạn việc chính hôm nay<input class="input" type="number" id="setMission" value="${db.settings.dailyMissionLimit}"></label><div class="full"><button class="btn" onclick="saveSettings()">Lưu settings</button></div></div><div class="card" style="margin-top:16px"><h3>Offline app</h3><p>Trạng thái hiện tại: <b>${navigator.onLine ? 'Online' : 'Offline'}</b>. App cache bằng service worker và dữ liệu vẫn lưu trong trình duyệt.</p></div>` }
    function saveSettings() { db.settings.availableStart = $('#setStart').value; db.settings.availableEnd = $('#setEnd').value; db.settings.dailyMissionLimit = Number($('#setMission').value) || 3; save(); render(); toast('Đã lưu settings') }
    function openModal(id) { $('#' + id).classList.add('open') } function closeModal(id) { $('#' + id).classList.remove('open') } function goTab(id) { currentTab = id; render() } window.goTab = goTab;
    function exportData() { const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'timeline-focus-backup.json'; a.click(); URL.revokeObjectURL(a.href) }
    function importData(e) { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { db = JSON.parse(r.result); normalize(); save(); render(); toast('Đã nhập dữ liệu') } catch (err) { toast('File không hợp lệ') } }; r.readAsText(f) }
    function requestNotify() { if (!('Notification' in window)) { toast('Trình duyệt không hỗ trợ thông báo'); return } Notification.requestPermission().then(p => { db.settings.notifications = p === 'granted'; save(); toast(p === 'granted' ? 'Đã bật thông báo' : 'Chưa cấp quyền') }) }
    function notify(title, body) { if (db.settings.notifications && Notification.permission === 'granted') new Notification(title, { body }); else toast(title + ' - ' + body) }
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => { }) }
    window.openTask = openTask; window.openTaskDetail = openTaskDetail; window.closeModal = closeModal; window.quickDur = quickDur; window.quickAdd = quickAdd; window.autoSchedule = autoSchedule; window.timelineClick = timelineClick; window.markDone = markDone; window.startFocus = startFocus; window.moveToStack = moveToStack; window.openTriage = openTriage; window.doToday = doToday; window.scheduleDebt = scheduleDebt; window.splitTask = splitTask; window.deleteById = deleteById; window.triageAction = triageAction; window.renderTriage = renderTriage; window.pauseFocus = pauseFocus; window.completeFocus = completeFocus; window.closeFocusReview = closeFocusReview; window.focusReviewDone = focusReviewDone; window.focusReviewSave = focusReviewSave; window.focusReviewNextAction = focusReviewNextAction; window.focusReviewStack = focusReviewStack; window.addFocus = addFocus; window.setFocusPreset = setFocusPreset; window.selectCalendarDay = selectCalendarDay; window.openEvent = openEvent; window.addPlanTask = addPlanTask; window.saveSettings = saveSettings; window.setTheme = setTheme; window.updateTaskFilter = updateTaskFilter; window.updateFlowSummary = updateFlowSummary; window.addFlowItem = addFlowItem; window.removeFlowItem = removeFlowItem; window.toggleFlowCheck = toggleFlowCheck; window.undoLast = undoLast;
    init();
  </script>
